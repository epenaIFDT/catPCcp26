<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo VASTEC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <span class="header-title">📋 Catálogo VASTEC</span>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar por modelo, N° parte, procesador...">
      </div>
      <div class="header-actions">
        <span id="user-name" style="font-size:0.85rem;color:var(--text-light);"></span>
        <a href="admin-local/index.html" class="btn btn-outline btn-sm" id="admin-link" style="display:none;text-decoration:none;">⚙️ Gestión</a>
        <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
      </div>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="filters-bar">
    <div class="filters-content">
      <div class="filters-row">
        <div class="filter-dropdown" data-filter="categoria">
          <button type="button" class="filter-dropdown-btn" id="btn-categoria">Categoría <span class="filter-count" id="count-categoria"></span></button>
          <div class="filter-dropdown-panel" id="panel-categoria"></div>
        </div>
        <div class="filter-dropdown" data-filter="procesador">
          <button type="button" class="filter-dropdown-btn" id="btn-procesador">Procesador <span class="filter-count" id="count-procesador"></span></button>
          <div class="filter-dropdown-panel" id="panel-procesador"></div>
        </div>
        <div class="filter-dropdown" data-filter="ram">
          <button type="button" class="filter-dropdown-btn" id="btn-ram">RAM <span class="filter-count" id="count-ram"></span></button>
          <div class="filter-dropdown-panel" id="panel-ram"></div>
        </div>
        <div class="filter-dropdown" data-filter="almacenamiento">
          <button type="button" class="filter-dropdown-btn" id="btn-almacenamiento">Almacenamiento <span class="filter-count" id="count-almacenamiento"></span></button>
          <div class="filter-dropdown-panel" id="panel-almacenamiento"></div>
        </div>
        <div class="filter-dropdown" data-filter="so">
          <button type="button" class="filter-dropdown-btn" id="btn-so">Sistema Operativo <span class="filter-count" id="count-so"></span></button>
          <div class="filter-dropdown-panel" id="panel-so"></div>
        </div>
        <div class="filter-dropdown" data-filter="software">
          <button type="button" class="filter-dropdown-btn" id="btn-software">Software <span class="filter-count" id="count-software"></span></button>
          <div class="filter-dropdown-panel" id="panel-software"></div>
        </div>

        <div class="price-range">
          <input type="number" id="price-min" placeholder="Min $">
          <span>-</span>
          <input type="number" id="price-max" placeholder="Max $">
        </div>

        <button id="filters-toggle" class="filters-toggle">⚙️ Más filtros</button>
        <button id="btn-clear-filters" class="btn-clear-filters" style="display:none;">🧹 Limpiar filtros</button>
      </div>

      <!-- ADVANCED FILTERS (hidden) -->
      <div id="filters-advanced" class="filters-advanced">
        <div class="filter-dropdown" data-filter="case">
          <button type="button" class="filter-dropdown-btn" id="btn-case">Gabinete <span class="filter-count" id="count-case"></span></button>
          <div class="filter-dropdown-panel" id="panel-case"></div>
        </div>
        <div class="filter-dropdown" data-filter="fuente">
          <button type="button" class="filter-dropdown-btn" id="btn-fuente">Fuente de Poder <span class="filter-count" id="count-fuente"></span></button>
          <div class="filter-dropdown-panel" id="panel-fuente"></div>
        </div>
        <div class="filter-dropdown" data-filter="video">
          <button type="button" class="filter-dropdown-btn" id="btn-video">Tarjeta de Video <span class="filter-count" id="count-video"></span></button>
          <div class="filter-dropdown-panel" id="panel-video"></div>
        </div>
        <div class="filter-dropdown" data-filter="chipset">
          <button type="button" class="filter-dropdown-btn" id="btn-chipset">Chipset <span class="filter-count" id="count-chipset"></span></button>
          <div class="filter-dropdown-panel" id="panel-chipset"></div>
        </div>

        <div class="pill-filter" data-filter="lan">
          <span class="pill-filter-label">LAN</span>
          <button type="button" class="pill-btn active" data-value="">Todos</button>
          <button type="button" class="pill-btn" data-value="si">Con</button>
          <button type="button" class="pill-btn" data-value="no">Sin</button>
        </div>
        <div class="pill-filter" data-filter="wlan">
          <span class="pill-filter-label">WLAN</span>
          <button type="button" class="pill-btn active" data-value="">Todos</button>
          <button type="button" class="pill-btn" data-value="si">Con</button>
          <button type="button" class="pill-btn" data-value="no">Sin</button>
        </div>
        <div class="pill-filter" data-filter="hdmi">
          <span class="pill-filter-label">HDMI</span>
          <button type="button" class="pill-btn active" data-value="">Todos</button>
          <button type="button" class="pill-btn" data-value="si">Con</button>
          <button type="button" class="pill-btn" data-value="no">Sin</button>
        </div>
        <div class="pill-filter" data-filter="vga">
          <span class="pill-filter-label">VGA</span>
          <button type="button" class="pill-btn active" data-value="">Todos</button>
          <button type="button" class="pill-btn" data-value="si">Con</button>
          <button type="button" class="pill-btn" data-value="no">Sin</button>
        </div>
        <div class="pill-filter" data-filter="optica">
          <span class="pill-filter-label">U. Óptica</span>
          <button type="button" class="pill-btn active" data-value="">Todos</button>
          <button type="button" class="pill-btn" data-value="si">Con</button>
          <button type="button" class="pill-btn" data-value="no">Sin</button>
        </div>
      </div>

      <!-- CHIPS DE FILTROS ACTIVOS -->
      <div id="active-filters-bar" class="active-filters-bar" style="display:none;"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <main class="results-container">
    <div class="results-header">
      <span class="results-count" id="results-count"></span>
      <label class="select-all-label">
        <input type="checkbox" id="select-all-filtered">
        Seleccionar todos los resultados (<span id="select-all-count">0</span>)
      </label>
      <div class="bulk-qty-control">
        <label for="bulk-qty-input">Cantidad para todos:</label>
        <input type="number" id="bulk-qty-input" min="1" value="1">
        <button type="button" id="btn-apply-bulk-qty" class="btn btn-outline btn-sm">Aplicar</button>
      </div>
      <div class="sort-controls">
        <label style="font-size:0.85rem;">Ordenar:</label>
        <select id="sort-by">
          <option value="precio-asc">Precio ↑</option>
          <option value="precio-desc">Precio ↓</option>
          <option value="ram-asc">RAM ↑</option>
          <option value="ram-desc">RAM ↓</option>
          <option value="nombre">Nombre A-Z</option>
        </select>
      </div>
    </div>
<!-- INDICADOR DE CARGA -->
<div id="loading-indicator" style="display:none;text-align:center;padding:20px;">
  <div style="display:inline-block;width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#1a56db;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  <p style="color:#6b7280;font-size:0.9rem;margin-top:8px;">Procesando filtros...</p>
</div>

<div class="cards-grid" id="products-grid"></div>

<!-- BOTÓN CARGAR MÁS -->
<div style="text-align:center;margin:24px 0;">
  <button id="btn-load-more" class="btn btn-outline" style="display:none;padding:12px 32px;">
    📦 Cargar más
  </button>
</div>

<!-- SENTINEL PARA INFINITE SCROLL -->
<div id="scroll-sentinel" style="height:1px;"></div>
  </main>

  <!-- SELECTION BAR -->
  <div class="selection-bar" id="selection-bar">
    <span class="selection-info">🛒 <strong id="selection-count">0</strong> producto(s) seleccionado(s)</span>
    <div class="selection-actions">
    <button class="btn btn-success btn-sm" id="btn-whatsapp">📱 WhatsApp</button>
    <button class="btn btn-outline btn-sm" id="btn-copy-summary" style="color:white;border-color:white;">📋 Copiar resumen</button>
    <button class="btn btn-outline btn-sm" id="btn-clear-selection" style="color:white;border-color:white;">✕ Limpiar</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/crypto.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
<style>
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</body>
</html>
